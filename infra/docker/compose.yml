services:
  hub:
    build:
      context: ../../apps/hub
      dockerfile: Dockerfile
    env_file: ../../apps/hub/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${TASK_HUB_PORT:-8080}:8080"
    volumes:
      - hub_storage:/var/www/html/storage
  worker:
    build:
      context: ../../apps/hub
      dockerfile: Dockerfile
    command: php artisan queue:work --verbose --tries=3 --timeout=120
    env_file: ../../apps/hub/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  scheduler:
    build:
      context: ../../apps/hub
      dockerfile: Dockerfile
    command: php artisan schedule:work
    env_file: ../../apps/hub/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_hub}
      POSTGRES_USER: ${POSTGRES_USER:-task_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  hub_storage:
  postgres_data:
  redis_data:

appId: dev.macatung.taskcompanion
productName: Task Companion
copyright: Copyright © 2026 Ma Cà Tưng
directories:
  output: release
  buildResources: public
files:
  - dist/**
  - dist-electron/**
  - package.json
asar: true
publish:
  provider: github
  owner: macatung
  repo: code-at-midnight
  releaseType: release
  channel: latest
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Task-Companion-Setup.${ext}
  signtoolOptions:
    publisherName: Ma Cà Tưng
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  runAfterFinish: true

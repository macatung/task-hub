appId: dev.macatung.taskcompanion
productName: Task Companion
electronVersion: 34.5.8
copyright: Copyright © 2026 Ma Cà Tưng
directories:
  output: release
  buildResources: public
files:
  - dist/**
  - dist-electron/**
  - package.json
# The renderer runs reliably from dist/ but crashes on this Windows machine
# when Chromium loads the same assets from app.asar. Keep release assets
# unpacked so the desktop agent remains usable on affected installations.
asar: false
publish:
  provider: github
  owner: macatung
  repo: code-at-midnight
  releaseType: release
  channel: latest
win:
  icon: public/icon.png
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Task-Companion-Setup.${ext}
  signtoolOptions:
    publisherName: Ma Cà Tưng
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  runAfterFinish: true
